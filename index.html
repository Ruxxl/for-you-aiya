<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Айганым</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a0508;
    --env: #8c1d1d;
    --env-dark: #6e1414;
    --env-light: #a32626;
    --paper: #f6ecdc;
    --ink: #4a1a1a;
    --cream: #f3e3cf;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px),
      radial-gradient(ellipse at 50% 40%, #4a0a10 0%, var(--bg) 55%, #140204 100%);
    color: var(--cream);
    font-family: Manrope, system-ui, sans-serif;
    overflow: hidden;
  }
  #dust { position: fixed; inset: 0; pointer-events: none; }

  .scene { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 24px; }
  .title { font-family: "Marck Script", cursive; font-size: clamp(30px, 8vw, 44px); line-height: 1.25; text-align: center; max-width: 420px; transition: opacity .8s ease, transform .8s ease; }

  /* ---------- конверт ---------- */
  .envelope { position: relative; width: min(320px, 80vw); aspect-ratio: 3 / 2; transform: rotate(-6deg); transition: transform 1s ease, opacity .9s ease; perspective: 900px; }
  .env-back, .env-front, .env-flap, .env-sliver { position: absolute; }
  .env-back { inset: 0; background: var(--env-dark); border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  .env-sliver { left: 8%; right: 8%; top: 6%; height: 80%; background: var(--paper); border-radius: 3px; transition: transform 1s cubic-bezier(.3,.7,.2,1) .55s; }
  .env-front { inset: 0; pointer-events: none; }
  .env-front::before, .env-front::after { content: ""; position: absolute; inset: 0; }
  .env-front::before { background: var(--env); clip-path: polygon(0 0, 52% 54%, 0 100%); }
  .env-front::after { background: var(--env-light); clip-path: polygon(100% 0, 48% 54%, 100% 100%); }
  .env-bottom { position: absolute; inset: 0; background: var(--env); clip-path: polygon(0 100%, 50% 46%, 100% 100%); }
  .env-flap { left: 0; right: 0; top: 0; height: 56%; background: var(--env-light); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform .9s cubic-bezier(.5,0,.2,1), z-index 0s .45s; z-index: 4; }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; background: var(--env-dark); }
  .envelope.open .env-sliver { transform: translateY(-48%); }

  .seal { position: absolute; left: 50%; top: 56%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 0; border-radius: 50%; cursor: pointer; z-index: 6; padding: 0;
    background: radial-gradient(circle at 35% 30%, #e8dcc6, #b9a98c 70%);
    box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 0 0 4px rgba(255,255,255,.18);
    font-family: "Marck Script", cursive; font-size: clamp(22px, 6vw, 30px); color: #6b5b3e; transition: transform .5s ease, opacity .5s ease; animation: pulse 2s ease-in-out infinite; }
  .seal::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.55); animation: ring 2s ease-out infinite; }
  .hint { position: absolute; left: 50%; top: calc(56% + 15%); transform: translateX(-50%); font-family: "Marck Script", cursive; font-size: 20px; color: var(--cream); white-space: nowrap; z-index: 6; animation: blink 2s ease-in-out infinite; }
  .envelope.open .seal { transform: translate(-50%, -50%) scale(1.6); opacity: 0; animation: none; pointer-events: none; }
  .envelope.open .hint { opacity: 0; animation: none; }

  .scene.reading .title { opacity: 0; transform: translateY(-20px); }
  .scene.reading .envelope { transform: translateY(70vh) rotate(-6deg); opacity: 0; }

  /* ---------- письмо ---------- */
  .letter { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .9s ease; }
  .letter.show { opacity: 1; pointer-events: auto; }
  .paper { background: var(--paper); color: var(--ink); width: min(380px, 100%); border-radius: 6px; padding: 40px 30px 32px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.6); transform: translateY(40px) scale(.94); transition: transform 1s cubic-bezier(.2,.8,.2,1); }
  .letter.show .paper { transform: none; }
  .paper h2 { font-family: "Marck Script", cursive; font-weight: 400; font-size: 34px; margin-bottom: 16px; }
  .paper p { font-size: 16px; line-height: 1.7; margin-bottom: 28px; color: #5a2a2a; }
  .paper .note { font-family: "Marck Script", cursive; font-size: 22px; margin: -8px 0 26px; color: var(--env); }
  .ready { border: 0; background: var(--env); color: var(--cream); font: 500 17px Manrope, sans-serif; padding: 14px 44px; border-radius: 999px; cursor: pointer; transition: transform .2s, background .2s; }
  .ready:hover { transform: scale(1.05); background: var(--env-light); }
  .ready:active { transform: scale(.97); }

  .story { position: fixed; inset: 0; z-index: 6; clip-path: circle(0 at var(--cx, 50%) var(--cy, 50%)); background: repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px), radial-gradient(ellipse at 50% 20%, #4a0a10 0%, var(--bg) 60%, #140204 100%); color: var(--cream); opacity: 0; pointer-events: none; transition: clip-path 1s cubic-bezier(.3,.7,.2,1), opacity .5s ease; }
  .story.show { opacity: 1; pointer-events: auto; clip-path: circle(150% at var(--cx, 50%) var(--cy, 50%)); }

  /* ---------- просмотр по одному фото ---------- */
  .viewer { position: absolute; inset: 0; max-width: 520px; margin: 0 auto; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  .viewer .top { position: absolute; left: 0; right: 0; top: 0; z-index: 5; padding: max(16px, env(safe-area-inset-top)) 18px 0; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  .viewer .bar { flex: 1; height: 3px; background: rgba(255,255,255,.22); border-radius: 2px; overflow: hidden; }
  .viewer .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; transition: width .5s ease; }
  .viewer .count { font: 500 12px Manrope, system-ui, sans-serif; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
  #stage { position: absolute; inset: 0; }
  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 22px 48px; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
  .slide.active { opacity: 1; }
    #bgstack { position: absolute; inset: 0; overflow: hidden; }
  .bgl { position: absolute; inset: -12%; background: center / cover no-repeat; filter: blur(36px) brightness(.4) saturate(1.2); opacity: 0; transition: opacity 1s ease; }
  .bgl.active { opacity: 1; }
  .bgvideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; mix-blend-mode: screen; pointer-events: none; transition: opacity 2.5s ease; -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 12%, #000 30%); mask-image: linear-gradient(to bottom, transparent 0, transparent 12%, #000 30%); }
  .story.show .bgvideo { opacity: .075; }
  .slide .frame { margin: 0; background: var(--paper); padding: 10px 10px 16px; border-radius: 4px; box-shadow: 0 24px 60px rgba(0,0,0,.6); transform: translateY(24px) rotate(var(--r, -1.2deg)) scale(.95); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
  .slide.active .frame { transform: rotate(var(--r, -1.2deg)); }
  .slide .ph { overflow: hidden; border-radius: 2px; background: #e6d6c0; }
  .slide .ph img { display: block; width: auto; height: auto; max-width: min(calc(100vw - 64px), 400px); max-height: 56vh; }
  .slide.active .ph img { animation: kb 14s ease-out forwards; }
  .slide .cap { margin: 26px 0 0; text-align: center; font-family: "Marck Script", cursive; font-size: clamp(26px, 7.4vw, 34px); line-height: 1.35; max-width: 380px; min-height: 2.7em; color: var(--cream); text-shadow: 0 2px 12px rgba(0,0,0,.65); opacity: 0; transform: translateY(10px); transition: opacity 1s ease .5s, transform 1s ease .5s; }
  .slide.active .cap { opacity: 1; transform: none; }
  .slide.finale { text-align: center; }
  .slide.finale .heart { width: 64px; height: 64px; fill: #e8493f; animation: beat 1.6s ease-in-out infinite; }
  .slide.finale p { font-family: "Marck Script", cursive; font-size: clamp(34px, 9vw, 46px); line-height: 1.3; margin: 22px 0 8px; }
  .slide.finale small { display: block; color: rgba(243,227,207,.65); font-size: 16px; margin-bottom: 34px; }
  .slide.finale.active { pointer-events: auto; }
  .again { border: 0; background: rgba(243,227,207,.14); color: var(--cream); font: 500 15px Manrope, system-ui, sans-serif; padding: 12px 28px; border-radius: 999px; cursor: pointer; border: .5px solid rgba(243,227,207,.35); }
  .tap-hint { position: absolute; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: rgba(255,255,255,.7); z-index: 5; transition: opacity 1s ease; pointer-events: none; }
  .tap-hint.hide { opacity: 0; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.07); } }
  @keyframes hop { 0%, 55%, 100% { transform: translateY(0); } 65% { transform: translateY(-6px); } 75% { transform: translateY(0); } 83% { transform: translateY(-3px); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }

  /* ---------- экран блокировки + звонок ---------- */
  .phone { position: fixed; inset: 0; z-index: 5; background: #000; display: flex; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
  .phone.show { opacity: 1; pointer-events: auto; }
  .lock { container-type: inline-size; position: relative; height: 100%; aspect-ratio: 589 / 1280; max-width: 100%; background: url(assets/lockscreen.jpg) center / cover no-repeat; overflow: hidden; }
  .banner { position: absolute; left: 3%; right: 3%; top: 4.6%; display: flex; align-items: center; gap: 3.2cqw; padding: 0 3.6cqw; height: 25.8cqw; border-radius: 3.9cqw; background: #5e5e5e; box-shadow: 0 6px 20px rgba(0,0,0,.3); transform: translateY(-160%); transition: transform .7s cubic-bezier(.2,1.2,.3,1); }
  .banner.in { transform: none; }
  .banner.ring { animation: shake .9s ease-in-out infinite; }
  .avatar { flex: none; width: 13cqw; aspect-ratio: 1; border-radius: 50%; background: url(assets/ruslan.webp) 0% 18% / 270% no-repeat; box-shadow: 0 0 0 .3cqw rgba(255,255,255,.15); }
  .caller { flex: 1; min-width: 0; color: #fff; line-height: 1.25; }
  .caller b { display: block; font: 600 4.8cqw system-ui, -apple-system, "SF Pro Text", sans-serif; }
  .caller span { font: 400 3.5cqw system-ui, -apple-system, sans-serif; color: rgba(255,255,255,.7); }
  .actions { display: flex; gap: 3.4cqw; }
  .btn { position: relative; width: 10.6cqw; aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: #fff; transition: transform .15s ease, filter .15s ease; }
  .btn svg { width: 52%; height: 52%; fill: currentColor; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  .btn.decline { background: #e8493f; }
  .btn.decline svg { transform: rotate(135deg); }
  .btn.accept { background: #5cc566; }
  .btn.accept::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: .4cqw solid #5cc566; animation: ring 1.6s ease-out infinite; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.9); }
  .call-note { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-family: "Marck Script", cursive; font-size: clamp(28px, 8vw, 40px); color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.7); opacity: 0; transition: opacity .8s ease; padding: 0 20px; }
  .call-note.show { opacity: 1; }

  /* ---------- главный экран и приложение «Фото» ---------- */
  .homescreen { position: absolute; inset: 0; z-index: 1; background: url(assets/home.jpg) center / cover no-repeat; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
  .homescreen.show { opacity: 1; pointer-events: auto; }
  .app-photos { position: absolute; left: 53.8%; top: 44%; width: 15.3%; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #fff; transition: transform .15s ease; }
  .app-photos:active { transform: scale(.92); }
  .app-photos .ico { position: relative; width: 100%; aspect-ratio: 1; border-radius: 22.5%; overflow: visible; }
  .app-photos .ico { animation: hop 1.8s ease-in-out infinite; }
  .app-photos .ico img { display: block; width: 100%; height: 100%; -webkit-user-drag: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  .app-photos .ico::after { content: ""; position: absolute; inset: -5%; border-radius: 26%; border: .5cqw solid rgba(255,255,255,.85); animation: ring 1.8s ease-out infinite; }
  .app-photos .lbl { margin-top: 1.9cqw; font: 400 2.9cqw system-ui, -apple-system, "SF Pro Text", sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.35); white-space: nowrap; }

  /* ---------- идёт разговор ---------- */
  .incall { position: absolute; inset: 0; z-index: 2; isolation: isolate; display: flex; flex-direction: column; align-items: center; padding: 20cqw 0 13cqw; color: #fff; font-family: system-ui, -apple-system, "SF Pro Text", sans-serif; opacity: 0; pointer-events: none; transition: opacity .9s ease; overflow: hidden; }
  .incall.show { opacity: 1; pointer-events: auto; }
  .incall::before { content: ""; position: absolute; inset: -20%; z-index: -1; background: linear-gradient(rgba(54,50,40,.72), rgba(40,38,32,.8)), url(assets/ruslan.webp) 20% 30% / cover; filter: blur(50px) saturate(1.3); }
  .incall .clip { position: absolute; left: 0; right: 0; top: 29%; aspect-ratio: 768 / 480; z-index: -1; opacity: 0; transition: opacity 1.8s ease; pointer-events: none; -webkit-mask-image: linear-gradient(to right, transparent 0, transparent 16%, #000 34%, #000 66%, transparent 84%, transparent 100%), linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent 0, transparent 16%, #000 34%, #000 66%, transparent 84%, transparent 100%), linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent); mask-composite: intersect; }
  .incall .clip.on { opacity: .5; }
  .incall .clip video { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .incall .who { text-align: center; }
  .incall .ava { width: 24cqw; aspect-ratio: 1; margin: 0 auto 4.5cqw; border-radius: 50%; background: url(assets/ruslan.webp) 0% 18% / 270% no-repeat; box-shadow: 0 0 0 .5cqw rgba(255,255,255,.18), 0 8px 28px rgba(0,0,0,.35); }
  .incall .name { font-size: 8.4cqw; font-weight: 500; letter-spacing: -.01em; }
  .incall .timer { margin-top: 1.6cqw; font-size: 5.4cqw; color: rgba(255,255,255,.62); font-variant-numeric: tabular-nums; transition: opacity .3s; }
  .incall .grid { margin-top: auto; display: grid; grid-template-columns: repeat(3, 21cqw); gap: 6cqw 8cqw; justify-content: center; }
  .incall .ctl { display: flex; flex-direction: column; align-items: center; gap: 2.4cqw; background: none; border: 0; padding: 0; color: #fff; font: 400 3.7cqw system-ui, -apple-system, sans-serif; cursor: pointer; }
  .incall .ctl i { width: 21cqw; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.17); transition: background .25s ease, color .25s ease, transform .15s ease; }
  .incall .ctl svg { width: 42%; height: 42%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .incall .ctl svg .f { fill: currentColor; stroke: none; }
  .incall .ctl:active i { transform: scale(.92); }
  .incall .ctl.on i { background: #fff; color: #1c1c1e; }
  .incall .end { margin-top: 12cqw; width: 21cqw; aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; background: #ff5a4f; display: grid; place-items: center; cursor: pointer; transition: transform .15s ease; }
  .incall .end:active { transform: scale(.92); }
  .incall .end svg { width: 46%; height: 46%; fill: #fff; transform: rotate(135deg); }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30% { transform: translateX(-3px) rotate(-.3deg); } 20%, 40% { transform: translateX(3px) rotate(.3deg); } 50% { transform: none; } }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.07); } }
  @keyframes ring { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes blink { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<canvas id="dust"></canvas>

<main class="scene" id="scene">
  <h1 class="title">Айганым, у меня<br>для тебя письмо</h1>

  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-sliver"></div>
    <div class="env-front"><div class="env-bottom"></div></div>
    <div class="env-flap"></div>
    <button class="seal" id="seal" aria-label="Открыть письмо">А</button>
    <span class="hint">нажми сюда</span>
  </div>
</main>

<section class="letter" id="letter" aria-live="polite">
  <div class="paper">
    <h2>Айганым,</h2>
    <p>прежде чем читать дальше, надень наушники и включи звук. Дальше будет музыка, и без неё это письмо потеряет половину магии.</p>
    <p class="note">Всё готово?</p>
    <button class="ready" id="ready">Я готова</button>
  </div>
</section>

<section class="phone" id="phone" aria-live="polite">
  <div class="lock">
    <div class="banner" id="banner">
      <div class="avatar" role="img" aria-label="Фото Ruslan"></div>
      <div class="caller"><b>Ruslan</b><span>мобильный</span></div>
      <div class="actions">
        <button class="btn decline" id="decline" aria-label="Отклонить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></button>
        <button class="btn accept" id="accept" aria-label="Ответить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></button>
      </div>
    </div>
    <div class="call-note" id="callNote"></div>
    <div class="homescreen" id="home">
      <button class="app-photos" id="photosApp" type="button" aria-label="Открыть Фото">
        <span class="ico"><img src="assets/photos-icon.png" alt="" draggable="false"></span>
        <span class="lbl">Фото</span>
      </button>
    </div>
    <div class="incall" id="incall" role="group" aria-label="Идёт разговор">
      <div class="clip" id="clip" aria-hidden="true"><video id="clipVideo" src="assets/video2.mp4" muted playsinline preload="auto"></video></div>
      <div class="who">
        <div class="ava" role="img" aria-label="Фото Ruslan"></div>
        <div class="name">Ruslan</div>
        <div class="timer" id="timer" role="timer">00:00</div>
      </div>
      <div class="grid">
        <button class="ctl" id="mute" type="button" aria-pressed="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/><path d="M4 4l16 16"/></svg></i>откл. звук</button>
        <button class="ctl" id="keys" type="button" aria-pressed="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="6" cy="4.5" r="1.9"/><circle class="f" cx="12" cy="4.5" r="1.9"/><circle class="f" cx="18" cy="4.5" r="1.9"/><circle class="f" cx="6" cy="9.5" r="1.9"/><circle class="f" cx="12" cy="9.5" r="1.9"/><circle class="f" cx="18" cy="9.5" r="1.9"/><circle class="f" cx="6" cy="14.5" r="1.9"/><circle class="f" cx="12" cy="14.5" r="1.9"/><circle class="f" cx="18" cy="14.5" r="1.9"/><circle class="f" cx="6" cy="19.5" r="1.9"/><circle class="f" cx="12" cy="19.5" r="1.9"/><circle class="f" cx="18" cy="19.5" r="1.9"/></svg></i>клавиши</button>
        <button class="ctl" id="speaker" type="button" aria-pressed="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M3.5 9.5v5h3.8l5 3.8V5.7l-5 3.8z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.7 7.7 0 0 1 0 10.8"/></svg></i>динамик</button>
        <button class="ctl" id="add" type="button" aria-pressed="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" style="stroke-width:2.1"/></svg></i>добавить</button>
        <button class="ctl" id="facetime" type="button" aria-pressed="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="2.5" y="6" width="12.5" height="12" rx="3"/><path class="f" d="M16.5 10.4l5-3v9.2l-5-3z"/></svg></i>FaceTime</button>
        <button class="ctl" id="contacts" type="button" aria-pressed="false"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.4 18.2c1.3-2.5 3.3-3.4 5.6-3.4s4.3.9 5.6 3.4"/></svg></i>контакты</button>
      </div>
      <button class="end" id="end" type="button" aria-label="Завершить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg></button>
    </div>
  </div>
</section>

<section class="story" id="story" aria-label="Для Айганым">
  <div class="viewer" id="viewer">
    <div class="top"><div class="bar"><i id="barFill"></i></div><span class="count" id="count"></span></div>
    <div id="bgstack"></div>
    <video class="bgvideo" id="bgVideo" src="assets/bg3.mp4" muted loop playsinline preload="auto" aria-hidden="true"></video>
    <div id="stage"></div>
    <div class="tap-hint" id="tapHint">нажимай или смахивай, чтобы листать</div>
  </div>
</section>

<audio id="ringtone" src="assets/ringtone.mp3" loop preload="auto"></audio>
<audio id="voice" src="assets/voice.mp3" preload="auto"></audio>
<audio id="voice2" src="assets/voice2.mp3" preload="auto"></audio>

<script>
  /* частицы-пыль на фоне */
  const c = document.getElementById('dust'), x = c.getContext('2d');
  let dots = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    dots = Array.from({ length: 50 }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 1.3 + .4, v: Math.random() * .15 + .03, p: Math.random() * 6.28
    }));
  }
  function draw(t) {
    x.clearRect(0, 0, c.width, c.height);
    for (const d of dots) {
      d.y -= d.v; if (d.y < -4) { d.y = c.height + 4; d.x = Math.random() * c.width; }
      x.globalAlpha = .25 + .45 * Math.abs(Math.sin(d.p + t / 1500));
      x.fillStyle = '#f3e3cf'; x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.28); x.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', resize); resize(); requestAnimationFrame(draw);

  /* открытие письма */
  const $ = id => document.getElementById(id);
  let opened = false;
  $('seal').onclick = () => {
    if (opened) return; opened = true;
    $('envelope').classList.add('open');
    setTimeout(() => $('scene').classList.add('reading'), 1700);
    setTimeout(() => $('letter').classList.add('show'), 2000);
  };

  /* «Я готова»: экран блокировки и входящий звонок */
  const ring = $('ringtone');
  $('ready').onclick = () => {
    $('letter').classList.remove('show');
    $('phone').classList.add('show');
    setTimeout(() => {
      ring.currentTime = 0; ring.volume = 1; ring.play().catch(() => {});
      $('banner').classList.add('in');
      setTimeout(() => $('banner').classList.add('ring'), 700);
      if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
    }, 1400);
  };

  const note = t => { const n = $('callNote'); n.textContent = t; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 2200); };
  $('decline').onclick = () => note('Не сбрасывай, пожалуйста…');

  /* ПРОСМОТР ПО ОДНОМУ. Листает она сама: нажатием или свайпом. Правь списки: порядок и подписи. */
  const FEATURED = [
    { photo: 'assets/photos/1.jpg', text: 'Ты танцуешь, а я смотрю и не могу отвести глаз.' },
    { photo: 'assets/photos/2.jpg', text: 'Даже когда ты просто задумалась, ты красивее всех.' },
    { photo: 'assets/photos/3.jpg', text: 'Идёшь вперёд так легко, что хочется идти за тобой куда угодно.' },
    { photo: 'assets/photos/4.jpg', text: 'Цветы рядом с тобой лишь украшение, а главная красота здесь ты.' },
    { photo: 'assets/photos/5.jpg', text: 'С тобой любой день похож на лето и на маленькое приключение.' },
  ];
  /* assets/aiya/NN.jpg (27 штук); 08, 09, 10 пропущены, они уже есть выше */
  const SKIP = new Set([8, 9, 10]);
  const CAPTIONS = {
    1: 'Ты как произведение искусства среди картин.',
    2: 'Играешь с камерой так, будто она тебя обожает.',
    3: 'Рядом с тобой даже бамбуковый лес похож на сказку.',
    4: 'Лето тебе идёт.',
    5: 'В тот вечер ты светилась ярче всех огней.',
    6: 'Элегантность это про тебя.',
    7: 'Солнце рядом с тобой греет ещё теплее.',
    11: 'Рядом с тобой хочется взлететь.',
    12: 'Ты и море. Идеальная пара.',
    13: 'Свободная, как ветер. Такой я тебя и люблю.',
    14: 'Улыбка, от которой становится теплее.',
    15: 'Жара, пляж, и всё равно ты самая яркая.',
    16: 'Если лететь, то только с тобой.',
    17: 'С тобой даже зима как сказка.',
    18: 'Горы красивые, но ты красивее.',
    19: 'Твоё спокойное «ты» мой любимый кадр.',
    20: 'Тёплая в любой мороз.',
    21: 'Стиль у тебя на отдельную выставку.',
    22: 'Вот этот взгляд, из-за которого я теряю слова.',
    23: 'В огнях гирлянд ты лучше любых огней.',
    24: 'Среди маков ты самый красивый цветок.',
    25: 'Даже в шлеме и в снегу ты милая.',
    26: 'Лёд, горы и ты. Как открытка.',
    27: 'Я бы смотрел на этот вид с тобой всю жизнь.',
  };
  const SLIDES = FEATURED.map(m => ({ ...m }));
  for (let n = 1; n <= 27; n++) if (!SKIP.has(n)) SLIDES.push({ photo: 'assets/aiya/' + String(n).padStart(2, '0') + '.jpg', text: CAPTIONS[n] || '' });
  SLIDES.push({ finale: true });

  const stage = $('stage'), viewer = $('viewer'), barFill = $('barFill'), countEl = $('count'), tapHint = $('tapHint');
  const bgStack = $('bgstack'), bgs = [];
  const els = SLIDES.map((m, i) => {
    const bg = document.createElement('div'); bg.className = 'bgl';
    if (m.photo) bg.style.backgroundImage = 'url(' + m.photo + ')';
    bgStack.appendChild(bg); bgs.push(bg);
    const el = document.createElement('div');
    el.className = 'slide';
    if (m.finale) {
      el.classList.add('finale');
      el.innerHTML = '<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.700 1.100 5.600 3.300C13.900 6.100 15.600 5 17.600 5 21 5 23.100 8.400 21.600 11.800 19.500 16.400 12 21 12 21z"/></svg><p>Спасибо, что ты есть.</p><small>Твой Ruslan</small><button class="again" type="button">Посмотреть ещё раз</button>';
      el.querySelector('.again').addEventListener('click', () => goTo(0));
    } else {
      el.innerHTML = '<figure class="frame"><div class="ph"><img alt="Айганым"></div></figure><p class="cap"></p>';
      el.querySelector('img').src = m.photo;
      el.querySelector('.cap').textContent = m.text;
      el.querySelector('.frame').style.setProperty('--r', ((i % 3) - 1) * 1.3 + 'deg');
      
    }
    stage.appendChild(el);
    return el;
  });

  let idx = -1;
  function goTo(i) {
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (i === idx) return;
    els.forEach((e, k) => e.classList.toggle('active', k === i));
    bgs.forEach((b, k) => b.classList.toggle('active', k === i));
    idx = i;
    const fin = !!SLIDES[i].finale;
    barFill.style.width = fin ? '100%' : ((i + 1) / (SLIDES.length - 1) * 100) + '%';
    countEl.textContent = fin ? '' : (i + 1) + ' / ' + (SLIDES.length - 1);
    for (let k = i + 1; k <= i + 2 && k < SLIDES.length; k++) if (SLIDES[k].photo) new Image().src = SLIDES[k].photo;
  }
  function startViewer() {
    idx = -1;
    tapHint.classList.remove('hide');
    clearTimeout(startViewer.t);
    startViewer.t = setTimeout(() => tapHint.classList.add('hide'), 6000);
    goTo(0);
    const bv = $('bgVideo'); bv.currentTime = 0; bv.play().catch(() => {});
  }

  /* листает она сама: нажатие справа/слева или свайп */
  let down = null;
  viewer.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) { down = null; return; }
    down = { x: e.clientX, y: e.clientY };
  });
  viewer.addEventListener('pointerup', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > 45 && ax > ay) goTo(idx + (dx < 0 ? 1 : -1));
    else if (ay > 45) goTo(idx + (dy < 0 ? 1 : -1));
    else {
      const r = viewer.getBoundingClientRect();
      goTo(idx + (e.clientX - r.left < r.width * .3 ? -1 : 1));
    }
    tapHint.classList.add('hide');
  });
  viewer.addEventListener('pointercancel', () => { down = null; });
  viewer.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (!$('story').classList.contains('show')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goTo(idx + 1); else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(idx - 1);
  });

  /* разговор начался: реальный таймер */
  let t0 = 0, tick = null;
  const pad = n => String(n).padStart(2, '0');
  const fmt = ms => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s); };

  $('accept').onclick = () => {
    ring.pause();
    $('banner').classList.remove('ring');
    $('banner').style.transform = 'translateY(-160%)';
    t0 = Date.now();
    $('timer').textContent = '00:00';
    tick = setInterval(() => { $('timer').textContent = fmt(Date.now() - t0); }, 250);
    setTimeout(() => $('incall').classList.add('show'), 450);
    const v = $('voice'), v2 = $('voice2'); v.currentTime = 0; v2.currentTime = 0; v.play().catch(() => {});
    /* TODO: здесь пойдёт история во время разговора */
  };

  /* видео проступает сквозь экран, пока идёт вторая запись */
  const clip = $('clip'), clipV = $('clipVideo');
  $('voice2').addEventListener('play', () => { clipV.currentTime = 0; clipV.play().catch(() => {}); clip.classList.add('on'); });
  $('voice2').addEventListener('timeupdate', () => { const v = $('voice2'); if (v.duration && v.duration - v.currentTime < 3.5) clip.classList.remove('on'); });
  const hideClip = () => { clip.classList.remove('on'); setTimeout(() => clipV.pause(), 1900); };
  $('voice2').addEventListener('ended', hideClip);

  /* вторая запись идёт сразу после первой */
  $('voice').addEventListener('ended', () => $('voice2').play().catch(() => {}));

  /* переключатели на экране разговора */
  document.querySelectorAll('.incall .ctl').forEach(b => b.addEventListener('click', () => {
    const on = b.classList.toggle('on'); b.setAttribute('aria-pressed', on);
    if (b.id === 'mute') $('voice').muted = $('voice2').muted = on;
  }));

  let callEnded = false;
  const endCall = () => {
    if (callEnded) return; callEnded = true;
    clearInterval(tick);
    $('voice').pause(); $('voice2').pause(); hideClip();
    $('timer').textContent = 'Вызов завершён';
    setTimeout(() => $('home').classList.add('show'), 900);
    setTimeout(() => $('incall').classList.remove('show'), 1300);
  };
  $('end').onclick = endCall;

  /* тап по «Фото»: приложение раскрывается из иконки */
  $('photosApp').onclick = () => {
    const r = $('photosApp').querySelector('.ico').getBoundingClientRect();
    const st = $('story');
    st.style.setProperty('--cx', (r.left + r.width / 2) + 'px');
    st.style.setProperty('--cy', (r.top + r.height / 2) + 'px');
    startViewer();
    requestAnimationFrame(() => st.classList.add('show'));
    setTimeout(() => $('phone').classList.remove('show'), 1400);
  };
  /* когда вторая запись дозвучала и затухла, звонок завершается сам */
  $('voice2').addEventListener('ended', () => setTimeout(endCall, 700));
</script>
</body>
</html>
